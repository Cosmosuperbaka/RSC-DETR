# RSC-DETR experiment registry
#
# One entry per result that appears in the manuscript. The point of this file is
# that a reader can go from a number in a table to the exact artefacts that
# produced it, and vice versa.
#
# NOTHING in here may be typed by hand from memory. Every path, hash and metric
# must be copied out of a run directory. Use tools/hash_artifacts.py to fill in
# the hashes.
#
# Status:
#   complete    - every field below is filled and verified
#   partial     - some fields still pending (marked TODO)
#   unresolved  - the number itself is in doubt, see docs/REPRODUCIBILITY.md

schema_version: 1
last_updated: "2026-10-12"

# --------------------------------------------------------------------------
# Conventions
# --------------------------------------------------------------------------
# paths are relative to RSCDETR_ROOT unless prefixed with ~
# every metric must name the script and the split that produced it
# --------------------------------------------------------------------------

datasets:

  vedai:
    version: "Vehicules1024, 8-class"
    annotation: "VEDAI/annotations/vedai_fold01_test_class8.json"
    split: "official fold 1 for the headline table; folds 1-10 for the 10-fold summary"
    image_count: {train: TODO, val: TODO, test: TODO}
    input_size: 1024

  m3fd_lt20:
    version: "M3FD long-tailed, seed 42, 6-class"
    annotation: "M3FD/processed/lt20_seed42/annotations/instances_test.json"
    split: {train: TODO, val: TODO, test: TODO}
    input_size: 1024
    note: "a de-duplicated test variant circulated at some point; see the open item in docs/REPRODUCIBILITY.md"

  dvtod:
    version: "RTDOD_HBB_3class (Person / Car / Bicycle)"
    annotation: "RTDOD_HBB_3class/annotations/instances_val.json"
    split: {train: 1606, val: 573, test: "none yet"}
    input_size: [1088, 1920]

# --------------------------------------------------------------------------
# Runs
# --------------------------------------------------------------------------
runs:

  - id: vedai-baseline-fold01
    dataset: vedai
    method: "RT-DETR concat baseline"
    seed: 3407
    config: "rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r50vd_vedai_1024_concat_baseline.yml"
    # the registry previously recorded .../baseline-s3407-10fold/baseline-fold1/best.pth,
    # but that directory is empty on the server — the concat-baseline 10-fold
    # checkpoints live under baseline-10fold/ (fold-1 best epoch AP 56.71)
    weights: "results/VEDAI/baseline-10fold/baseline-fold1/best.pth"
    log: TODO
    metrics:
      AP: TODO
      AP50: TODO
      AP75: TODO
    hashes: {config: TODO, weights: TODO, predictions: TODO}
    status: partial

  - id: vedai-rscdetr-fold01
    dataset: vedai
    method: "RSC-DETR"
    seed: 3407
    config: "rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r50vd_vedai_1024_test-x1x3-v19c-spsf_seed3407_30e.yml"
    # headline fold-1 run; config name recorded by valbest_test.log
    # (the registry previously used the ..._fold01_30e.yml spelling)
    weights: "~/re-detr-last/result/VEDAI/test-x1x3-v19c-spsf_seed3407/best.pth"
    lfs_release: "weights/vedai_rscdetr_fold01_s3407_1024_eval.pth"
    log: "~/re-detr-last/result/VEDAI/test-x1x3-v19c-spsf_seed3407/valbest_test.log"
    metrics:
      AP: 59.31         # re-eval of the released EMA weights: 59.311
      AP50: 88.54       # re-eval: 88.536
      AP75: 71.47       # re-eval: 71.467
      params_M: 90.109  # evaluation/reports/complexity_vedai.json @1024x1024
      gflops: 747.06
      latency_ms: 35.30 # median, FP32 batch 1, idle RTX 4090 (latency_vedai.json)
    hashes:
      config: TODO
      weights: d4f31f19a617108998cfbf19e44df1a30842b9e3294f3d92683992f5e2a64efe   # LFS copy, server==client verified 2026-10-12
      predictions: TODO
    status: partial
    note: >
      The re-evaluation artefacts live next to the run:
      valbest_test.log (per-class table) and valbest_test_perclass/per_class.json
      (8-class means AP 59.311 / AP50 88.536 / AP75 71.467), which match the
      manuscript headline 59.31.

  - id: vedai-rscdetr-fold02
    dataset: vedai
    method: "RSC-DETR"
    seed: 3407
    config: "rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r50vd_vedai_1024_test-x1x3-v19c-spsf_seed3407_fold01_30e.yml"
    weights: "results/VEDAI/v19c-spsf-s3407-10fold/fold02/best.pth"
    lfs_release: "weights/vedai_rscdetr_fold02_s3407_1024_eval.pth"
    log: "results/VEDAI/v19c-spsf-s3407-10fold/fold02/log.txt"
    metrics:
      AP: TODO
      AP50: TODO
      AP75: TODO
    hashes:
      config: TODO
      weights: 1258aefd5dccf40f5deda8d418c74433b58a8aa814b74bf61889351bcc4f3caf   # LFS copy, server==client verified 2026-10-10
      predictions: TODO
    status: partial
    note: >
      10-fold member (fold 2). Released alongside the headline fold-1 weights.

  - id: m3fd-rscdetr
    dataset: m3fd_lt20
    method: "RSC-DETR"
    seed: 42
    config: "rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r50vd_m3fd_lt20_seed42_x1x3_v19c_spsf_native_res_b8_45e.yml"
    weights: "~/re-detr-last/ablations/rtdetr-x1x3-v19c-spsf-native-res-b8-45e_M3FD-LT20_b8-45e/best_M3FD-LT20_b8-45e.pth"
    lfs_release: "weights/m3fd_lt20_rscdetr_s42_b8_1024_eval.pth"
    log: "~/re-detr-last/ablations/rtdetr-x1x3-v19c-spsf-native-res-b8-45e_M3FD-LT20_b8-45e/log.txt"
    metrics:
      AP: 55.90         # re-eval of the released EMA weights: 55.897
      AP50: 84.09       # re-eval: 84.088
      AP75: 60.51       # re-eval: 60.507
      params_M: 90.103  # evaluation/reports/complexity_m3fd.json @1024x1024
      gflops: 747.03
      latency_ms: 37.70 # median, FP32 batch 1, idle RTX 4090 (latency_m3fd.json)
    hashes:
      config: TODO
      weights: e4f3e021bcbeff33c35f6541c762cb94e37aef408db85dfe1cd168efd10ed307   # LFS copy, server==client verified 2026-10-10
      predictions: TODO
    status: partial
    note: >
      Resolved 2026-10-12. The re-evaluation of the released checkpoint on the
      standard test split exists at
      outputs/m3fd_lt20_s42_b8_valbest_test_requested/v19c_spsf/
      (per_class.json; 6-class means AP 55.897 / AP50 84.088 / AP75 60.507)
      and matches the manuscript value 55.90, which is therefore frozen.
      The 55.95 figure traces to a re-evaluation on a de-duplicated test
      variant and is NOT the manuscript number; see docs/REPRODUCIBILITY.md.

  - id: dvtod-rscdetr
    dataset: dvtod
    method: "RSC-DETR"
    seed: 42
    config: "configs/RSC-DETR_DVTOD.yml"
    # shipped top-level config, recovered from the run's own tensorboard config
    # dump and renamed to the public symbols; training-time file was
    # configs/rtdod_1920_shdetr_c2_15e_b2_seed42.yml (include chain off
    # rtdetrv2_r50vd_rtdod_hbb_seed42_1920_shdetr_15e_scaled.yml), since deleted
    # on the server. Training used the retired 'v19c' balance variant; the
    # shipped config carries final_harmonization (evaluation is unaffected).
    weights: "~/re-detr-last/result/RTDOD_HBB_3class/shdetr_c2_1920_b2_15e_seed42/best.pth"
    lfs_release: "weights/dvtod_rscdetr_s42_1920_eval.pth"
    log: "~/re-detr-last/result/RTDOD_HBB_3class/perclass_sh_c2_best.log"
    # the log's [eval_per_class_test] resume= line names the checkpoint above;
    # predictions live in result/RTDOD_HBB_3class/perclass_sh_c2_best/
    metrics:
      AP: 56.66         # per-class means: 56.664; re-eval 56.663 (dvtod_reeval.json)
      AP50: 89.50       # 89.495
      AP75: 61.21       # 61.212
      params_M: 90.096  # evaluation/reports/complexity_dvtod.json @1088x1920
      gflops: 1485.48
      latency_ms: 61.33 # median, FP32 batch 1, idle RTX 4090 (latency_dvtod.json)
    hashes:
      config: c2c51709cd61d593778db21036c2344267adda0d7ee8538d3d3d39edf7a59b7d   # configs/RSC-DETR_DVTOD.yml
      weights: 04acfa9296594e3f92b31a4fad7873c363f72a43eae31931440d255a6443e2f7   # LFS copy, server==client verified 2026-10-10
      predictions: 11b9470d7a591ec11ecfb8f914c98ebe03396959510ed373b49549b6a8d457ae   # perclass_sh_c2_best/predictions.json
    status: partial
    note: >
      Validation numbers (Person / Car / Bicycle); no independent test split
      exists. Metrics computed from result/RTDOD_HBB_3class/perclass_sh_c2_best/
      per_class.json, which match the manuscript (56.66 / 89.49 / 61.21).

