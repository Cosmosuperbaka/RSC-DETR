      vedai_fold01_test: {mean_AP: 57.723, std_AP: 1.767, n: 3}
      m3fd_lt20_final_test: {mean_AP: 55.623, std_AP: 0.464, n: 3}
      dvtod_val: {mean_AP: 55.454, std_AP: 1.053, n: 3}
    report: evaluation/reports/multiseed_and_10fold_summary.json
